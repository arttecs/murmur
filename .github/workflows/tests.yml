name: Tests

on: [push, pull_request]

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis
          coverage: none
      - run: composer update --with illuminate/support:^${{ matrix.laravel }} --no-interaction --no-progress
      - run: vendor/bin/pint --test
      - run: vendor/bin/pest

  javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - run: node --input-type=module -e "import { Murmur } from './dist/index.js'; if (typeof Murmur !== 'function') process.exit(1)"
