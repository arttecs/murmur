version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
